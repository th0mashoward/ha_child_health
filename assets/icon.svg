<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d3c1"/>
      <stop offset="1" stop-color="#0d7f94"/>
    </linearGradient>
    <linearGradient id="merc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#ff4d5e"/>
    </linearGradient>
    <!-- thermometer body with the glass cut out so the background shows through -->
    <mask id="glass" maskUnits="userSpaceOnUse" x="-120" y="-200" width="240" height="400">
      <rect x="-120" y="-200" width="240" height="400" fill="#fff"/>
      <rect x="-17" y="-140" width="34" height="210" rx="17" fill="#000"/>
      <circle cx="0" cy="104" r="44" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- thermometer -->
  <g transform="translate(262 250) rotate(-35)">
    <g mask="url(#glass)" fill="#ffffff">
      <rect x="-36" y="-168" width="72" height="262" rx="36"/>
      <circle cx="0" cy="104" r="68"/>
    </g>
    <!-- mercury -->
    <circle cx="0" cy="104" r="34" fill="url(#merc)"/>
    <rect x="-9" y="-30" width="18" height="134" rx="9" fill="url(#merc)"/>
    <!-- scale marks -->
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
      <line x1="54" y1="-110" x2="82" y2="-110"/>
      <line x1="54" y1="-66" x2="74" y2="-66"/>
      <line x1="54" y1="-22" x2="82" y2="-22"/>
      <line x1="54" y1="22" x2="74" y2="22"/>
    </g>
  </g>

  <!-- heart -->
  <g transform="translate(142 372) rotate(-12) scale(1.15)">
    <path d="M0 44 C-70 -6 -72 -66 -34 -70 C-16 -72 -4 -60 0 -48 C4 -60 16 -72 34 -70 C72 -66 70 -6 0 44 Z"
          fill="#ff5a6b" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
